<!doctype html><html><head><meta charset="utf-8"><title>Touchline replay calibration</title><style>body{background:#090d12;color:#ddd;font:14px monospace;margin:16px}button,input,select{font:inherit;background:#17212a;color:#fff;border:1px solid #465362;padding:8px;margin:3px}#player{width:960px;height:540px}#events{display:flex;flex-wrap:wrap;width:1000px}#events button{font-size:11px;padding:5px}.status{padding:10px;color:#f2aa50}a{color:#f2aa50}</style></head><body><h2>OFFICIAL PLAYER · TIMELINE CALIBRATION</h2><select id="fixture" aria-label="Calibration fixture"></select><input id="seconds" type="number" aria-label="Video timestamp" value="0"><button id="seek">SEEK</button><button id="play">PLAY</button><button id="pause">PAUSE</button><button id="back">−5s</button><button id="forward">+5s</button><div class="status" id="status">Loading API</div><div id="player"></div><div id="events"></div><p>Positions below are estimates until visually verified. No video is downloaded.</p><script type="module">
import {fixtures, VIDEO_ID} from '/src/replay/manifest.ts';
const select=document.querySelector('#fixture'), field=document.querySelector('#seconds'), status=document.querySelector('#status'),events=document.querySelector('#events');
let p,requested=0,pending=false;
fixtures.forEach(f=>select.add(new Option(f.home+' v '+f.away,f.id)));
function seek(t){requested=t;pending=true;field.value=t;p?.playVideo();p?.seekTo(t,true);}
function fixture(){const f=fixtures.find(x=>x.id===select.value);events.replaceChildren();
for(const period of f.periods){const b=document.createElement('button');b.textContent=period.phase+' '+period.start;b.onclick=()=>seek(period.start);events.append(b)}
for(const e of f.events){const b=document.createElement('button');b.textContent=e.minute+(e.addedTime?'+'+e.addedTime:'')+' '+e.player+' '+e.videoSecond;b.onclick=()=>seek(e.videoSecond);events.append(b)}seek(f.start)}
select.onchange=fixture;document.querySelector('#seek').onclick=()=>seek(Number(field.value));document.querySelector('#play').onclick=()=>p?.playVideo();document.querySelector('#pause').onclick=()=>p?.pauseVideo();document.querySelector('#back').onclick=()=>seek(p.getCurrentTime()-5);document.querySelector('#forward').onclick=()=>seek(p.getCurrentTime()+5);
window.onYouTubeIframeAPIReady=()=>{p=new YT.Player('player',{videoId:VIDEO_ID,host:'https://www.youtube-nocookie.com',playerVars:{controls:1,origin:location.origin,enablejsapi:1},events:{onReady:()=>{fixture();p.pauseVideo();},onError:e=>{status.textContent='PLAYER ERROR '+e.data}}});setInterval(()=>{if(p.getCurrentTime&&pending&&p.getPlayerState()===1&&Math.abs(p.getCurrentTime()-requested)<1){p.pauseVideo();pending=false;}if(p.getCurrentTime)status.textContent='PLAYER VIDEO SECOND '+p.getCurrentTime().toFixed(2)+' · REQUESTED '+requested+' · STATE '+p.getPlayerState()},250)};
const api=document.createElement('script');api.src='https://www.youtube.com/iframe_api';document.head.append(api);
</script></body></html>
